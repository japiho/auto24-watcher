name: probe car sites

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Probe
        run: |
          mkdir -p out && cd out
          python - <<'PY'
          import requests, json
          H = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36",
               "Accept-Language": "et-EE,et;q=0.9,en;q=0.8",
               "Accept": "application/json, text/html;q=0.9, */*;q=0.8", "Origin": "https://autodiiler.ee", "Referer": "https://autodiiler.ee/"}
          sites = {
            "ad_api": "https://garage.autodiiler.ee/api/v1/vehicles?vt=1&ba=18&page=1",
            "ad_api_robots": "https://garage.autodiiler.ee/robots.txt",
            "ap_c": "https://autoportaal.ee/et/kuulutused?ok=1&make_id=59&model_id=2117&body_type%5B%5D=3&year_min=2016&price_max=34000&power_min=110&mileage_max=150000&sort=id_desc",
          }
          res = {}
          for name, url in sites.items():
              row = {"url": url}
              for kind, u in (("home", url), ):
                  try:
                      r = requests.get(u, headers=H, timeout=25)
                      row[kind] = {"status": r.status_code, "final": r.url,
                                   "server": r.headers.get("server"),
                                   "cf_mitigated": r.headers.get("cf-mitigated"),
                                   "len": len(r.text)}
                      open(f"{name}_{kind}.txt", "w", encoding="utf-8").write(r.text)
                  except Exception as e:
                      row[kind] = {"error": str(e)}
              res[name] = row
          json.dump(res, open("summary.json", "w"), indent=1)
          print(json.dumps(res, indent=1))
          PY
      - name: Save to probe branch
        run: |
          cd out
          git init -q -b probe
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add -A; git commit -qm "probe results"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
