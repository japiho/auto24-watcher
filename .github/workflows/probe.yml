name: probe car sites

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Probe
        run: |
          mkdir -p /tmp/out
          python probe_urls.py /tmp/out
      - name: Save to probe branch
        run: |
          cd /tmp/out
          git init -q -b probe
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add -A; git commit -qm "probe results"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
