name: auto24 watcher

on:
  schedule:
    # 04:47 UTC = 07:47 Tallinn in summer, 06:47 in winter.
    # GitHub cron is UTC-only and often runs 5–30 min late.
    - cron: "47 4 * * *"
  workflow_dispatch: {}   # "Run workflow" button for manual runs

permissions:
  contents: write   # commit state/listings.json
  issues: write     # post the daily report as an issue

concurrency:
  group: auto24-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrape and diff
        run: python watcher.py

      - name: Commit updated state
        run: |
          git config user.name  "auto24-watcher"
          git config user.email "actions@users.noreply.github.com"
          git add state/listings.json
          git diff --cached --quiet || git commit -m "Snapshot $(date -u +%F)"
          git push

      - name: Post report as GitHub issue
        if: hashFiles('report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create auto24 --color 0E8A16 --force >/dev/null 2>&1 || true
          gh issue create \
            --title "auto24 $(TZ=Europe/Tallinn date +%d.%m.%Y)" \
            --label auto24 \
            --body-file report.md

      - name: Send report to Telegram (optional)
        if: hashFiles('report.md') != '' && env.TELEGRAM_BOT_TOKEN != ''
        run: python notify_telegram.py report.md

      - name: Upload page HTML on failure (for debugging)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: debug/
          retention-days: 7
