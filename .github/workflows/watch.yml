name: auto24 watcher

# The daily schedule is OFF: auto24 blocks GitHub's servers with a Cloudflare
# check, so the daily run happens on the phone instead (see PHONE_SETUP.md).
# This workflow is kept for manual runs only, in case that ever changes.
on:
  workflow_dispatch: {}   # "Run workflow" button for manual runs
  # schedule:
  #   - cron: "47 4 * * *"   # 07:47 Tallinn (summer) / 06:47 (winter)

permissions:
  contents: write   # commit state/listings.json
  issues: write     # post the daily report as an issue

concurrency:
  group: auto24-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrape and diff
        run: |
          mkdir -p debug
          set -o pipefail
          python watcher.py 2>&1 | tee debug/run.log

      - name: Commit updated state
        run: |
          git config user.name  "auto24-watcher"
          git config user.email "actions@users.noreply.github.com"
          git add state/listings.json
          git diff --cached --quiet || git commit -m "Snapshot $(date -u +%F)"
          git push

      - name: Post report as GitHub issue
        if: hashFiles('report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create auto24 --color 0E8A16 --force >/dev/null 2>&1 || true
          gh issue create \
            --title "auto24 $(TZ=Europe/Tallinn date +%d.%m.%Y)" \
            --label auto24 \
            --body-file report.md

      - name: Send report to Telegram (optional)
        if: hashFiles('report.md') != '' && env.TELEGRAM_BOT_TOKEN != ''
        run: python notify_telegram.py report.md

      - name: Upload page HTML on failure (for debugging)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: debug/
          retention-days: 7

      - name: Save debug output to the 'debug' branch on failure
        if: failure()
        run: |
          cp -r debug /tmp/debug
          git config user.name  "auto24-watcher"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan debug-tmp
          git rm -rf --quiet . || true
          cp -r /tmp/debug/. .
          git add -A
          git commit -m "Debug output from failed run ${{ github.run_id }}"
          git push -f origin HEAD:debug
