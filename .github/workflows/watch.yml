name: car watcher

on:
  schedule:
    # 04:47 UTC = 07:47 Tallinn in summer, 06:47 in winter.
    # GitHub cron is UTC-only and often runs 5–30 min late.
    - cron: "47 4 * * *"
  workflow_dispatch:      # "Run workflow" button for manual runs
    inputs:
      dry_run:
        description: "Test run: no issue, no state commit; log saved to the 'debug' branch"
        type: boolean
        default: false
      test_email:
        description: "Only send a test email (no scraping)"
        type: boolean
        default: false

permissions:
  contents: write   # commit state/listings.json (+ debug branch on failure)
  issues: write     # post the daily report as an issue

concurrency:
  group: car-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Send test email
        if: ${{ inputs.test_email }}
        env:
          SMTP_HOST: mail.veebimajutus.ee
          SMTP_PORT: "465"
          SMTP_USER: jakob@kergeraskus.ee
          SMTP_SENDER_NAME: Autod watcher
          EMAIL_TO: ${{ vars.EMAIL_TO || 'jakob.pihol@gmail.com' }}
        run: |
          test -n "$SMTP_PASSWORD" || { echo "SMTP_PASSWORD secret is not set"; exit 1; }
          printf '%s\n' "**Test email** from the car watcher." "" "If you can read this, the daily reports will arrive here too." > /tmp/test.md
          python notify_email.py /tmp/test.md

      - name: Scrape and diff
        if: ${{ !inputs.test_email }}
        run: |
          mkdir -p debug
          set -o pipefail
          python watcher.py 2>&1 | tee debug/run.log

      - name: Commit updated state
        if: ${{ !inputs.dry_run && !inputs.test_email }}
        run: |
          git config user.name  "car-watcher"
          git config user.email "actions@users.noreply.github.com"
          git add state/listings.json
          git diff --cached --quiet || git commit -m "Snapshot $(date -u +%F)"
          git push

      - name: Post report as GitHub issue
        if: ${{ !inputs.dry_run && hashFiles('report.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create cars --color 0E8A16 --force >/dev/null 2>&1 || true
          url=$(gh issue create \
            --title "Autod $(TZ=Europe/Tallinn date +%d.%m.%Y)" \
            --label cars \
            --body-file report.md)
          echo "ISSUE_URL=$url" >> "$GITHUB_ENV"

      - name: Email the report
        # Same mail server as the nexara app (veebimajutus), sent as jakob@kergeraskus.ee.
        # Runs once the SMTP_PASSWORD repository secret is set.
        if: ${{ !inputs.dry_run && hashFiles('report.md') != '' && env.SMTP_PASSWORD != '' }}
        env:
          SMTP_HOST: mail.veebimajutus.ee
          SMTP_PORT: "465"
          SMTP_USER: jakob@kergeraskus.ee
          SMTP_SENDER_NAME: Autod watcher
          EMAIL_TO: ${{ vars.EMAIL_TO || 'jakob.pihol@gmail.com' }}
        run: python notify_email.py report.md

      - name: Send report to Telegram (optional)
        if: ${{ !inputs.dry_run && hashFiles('report.md') != '' && env.TELEGRAM_BOT_TOKEN != '' }}
        run: python notify_telegram.py report.md

      - name: Save debug output to the 'debug' branch (on failure or test run)
        if: ${{ failure() || inputs.dry_run }}
        run: |
          cp report.md debug/ 2>/dev/null || true
          cp -r debug /tmp/debug
          git config user.name  "car-watcher"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan debug-tmp
          git rm -rf --quiet . || true
          cp -r /tmp/debug/. .
          git add -A
          git commit -m "Debug output from failed run ${{ github.run_id }}"
          git push -f origin HEAD:debug
